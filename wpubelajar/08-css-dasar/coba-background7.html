<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #333;
        }
        .frame{
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(img/spider_man_PNG40.png),url(img/download.png),url(img/background.jpeg);
            background-size: 320px,400px, 700px;
            background-repeat: no-repeat,no-repeat, no-repeat;
            background-position: center bottom, center;
            border-radius: 50%;
        }
        h1{
            color: white;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
</body>
</html>
