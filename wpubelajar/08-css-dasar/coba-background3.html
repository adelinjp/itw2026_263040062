<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
            background-color: lightblue;
            background-image: linear-gradient(rgb(99, 0, 0),rgb(58, 57, 57));
            height: 100vh;
        }
        .kotak1 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: linear-gradient(to bottom, lightblue, lightgreen);
        }
        .kotak2 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: radial-gradient( lightblue, rgb(252, 159, 174));
        }
        .kotak3 {
            width: 300px;
            height: 300px;
            background-color: salmon;
            background-image: conic-gradient(black, red,Maroon);
        }
    </style>
</head>
<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
